# Tenant Type
type Tenant {
  id: ID!
  tenanturn: String!
  name: String!
  description: String
  domain: String
  logoUrl: String
  settings: JSON
  isActive: Boolean!
  createdAt: Date!
  updatedAt: Date!
}

# Tenant Input Types
input CreateTenantInput {
  name: String!
  description: String
  domain: String
  logoUrl: String
  settings: JSON
}

input UpdateTenantInput {
  id: ID!
  name: String
  description: String
  domain: String
  logoUrl: String
  settings: JSON
  isActive: Boolean
}

input TenantFilter {
  search: String
}

# Tenant Response Types
type TenantEdge implements Edge {
  cursor: String!
  node: Tenant!
}

type TenantConnection implements Connection {
  edges: [TenantEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

# Tenant Queries (to be extended in main Query type)
extend type Query {
  tenant(id: ID!, tenanturn: String): Tenant
  tenantByTenanturn(tenanturn: String!): Tenant
  tenantByDomain(domain: String!): Tenant
  tenants(
    filter: TenantFilter
    pagination: PaginationInput
    sort: SortInput
    tenanturn: String
  ): TenantConnection!
}

# Tenant Mutations (to be extended in main Mutation type)
extend type Mutation {
  createTenant(createTenantInput: CreateTenantInput!, tenanturn: String): Tenant!
  updateTenant(updateTenantInput: UpdateTenantInput!, tenanturn: String): Tenant!
  removeTenant(id: ID!, tenanturn: String): Boolean!
}