# Common input types used across entities

# Cursor-based pagination input
input PaginationInput {
  first: Int = 20
  after: String
  last: Int
  before: String
}

# Sort input
input SortInput {
  field: String!
  direction: SortDirection = DESC
}

# PageInfo for cursor pagination
type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

# Edge type for cursor pagination
interface Edge {
  cursor: String!
}

# Connection interface for cursor pagination
interface Connection {
  edges: [Edge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

# Auth payload
type AuthPayload {
  user: User!
  accessToken: String!
}

# Upload URL response
type UploadUrlResponse {
  uploadUrl: String!
  downloadUrl: String!
  s3Key: String!
}