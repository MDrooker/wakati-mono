# UserUpload Type
type UserUpload {
  id: ID!
  uploadurn: String!
  filename: String!
  originalFileName: String!
  mimeType: String!
  fileSize: Int!
  storageKey: String!
  bucket: String!
  assetType: AssetType!
  status: UploadStatus!
  tags: [String!]!
  metadata: JSON
  aiAnalysis: JSON
  description: String
  isActive: Boolean!
  createdAt: Date!
  updatedAt: Date!
  userurn: String!
  packageId: String
  
  # Relationships
  user: User!
  package: Package
  
  # Computed fields
  downloadUrl: String
}

# UserUpload Input Types
input CreateUserUploadInput {
  filename: String!
  originalFileName: String!
  mimeType: String!
  fileSize: Int!
  storageKey: String!
  bucket: String!
  assetType: AssetType!
  tags: [String!] = []
  metadata: JSON
  description: String
  packageId: String
}

input UpdateUserUploadInput {
  tags: [String!]
  metadata: JSON
  description: String
  packageId: String
}

input UserUploadFilter {
  status: UploadStatus
  assetType: AssetType
  packageId: String
  tags: [String!]
}

# UserUpload Response Types
type UserUploadEdge implements Edge {
  cursor: String!
  node: UserUpload!
}

type UserUploadConnection implements Connection {
  edges: [UserUploadEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

# UserUpload Queries (to be extended in main Query type)
extend type Query {
  userUpload(id: ID!): UserUpload
  userUploads(
    filter: UserUploadFilter
    pagination: PaginationInput
    sort: SortInput
  ): UserUploadConnection!
  myUploads(
    filter: UserUploadFilter
    pagination: PaginationInput
    sort: SortInput
  ): UserUploadConnection!
  approvedUploads(
    packageId: String
    pagination: PaginationInput
    sort: SortInput
  ): UserUploadConnection!
  pendingUploads(
    pagination: PaginationInput
    sort: SortInput
  ): UserUploadConnection!
  
  # Upload Management
  generateUploadUrl(
    filename: String!
    mimeType: String!
    fileSize: Int!
  ): UploadUrlResponse!
  getDownloadUrl(s3Key: String!): String!
}

# UserUpload Mutations (to be extended in main Mutation type)
extend type Mutation {
  createUserUpload(input: CreateUserUploadInput!): UserUpload!
  updateUserUpload(id: ID!, input: UpdateUserUploadInput!): UserUpload!
  deleteUserUpload(id: ID!): Boolean!
  updateUploadStatus(id: ID!, status: UploadStatus!): UserUpload!
  updateAiAnalysis(id: ID!, aiAnalysis: JSON!): UserUpload!
  
  # Moderation (Admin only)
  approveUpload(id: ID!): UserUpload!
  rejectUpload(id: ID!, reason: String): UserUpload!
  bulkUpdateUploadStatus(ids: [ID!]!, status: UploadStatus!): [UserUpload!]!
}