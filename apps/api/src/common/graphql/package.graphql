# Package Type
type Package {
  id: ID!
  packageurn: String!
  name: String!
  description: String
  tags: [String!]!
  metadata: JSON
  status: PackageStatus!
  isActive: Boolean!
  createdAt: Date!
  updatedAt: Date!
  userId: String!
  
  # Relationships
  user: User!
  uploads: [UserUpload!]!
  collections: [Collection!]!
}

# Package Input Types
input CreatePackageInput {
  name: String!
  description: String
  tags: [String!] = []
  metadata: JSON
  status: PackageStatus = DRAFT
}

input UpdatePackageInput {
  name: String
  description: String
  tags: [String!]
  metadata: JSON
  status: PackageStatus
  isActive: Boolean
}

input PackageFilter {
  status: PackageStatus
  isActive: Boolean
  tags: [String!]
}

# Package Response Types
type PackageEdge implements Edge {
  cursor: String!
  node: Package!
}

type PackageConnection implements Connection {
  edges: [PackageEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

# Package Queries (to be extended in main Query type)
extend type Query {
  package(id: ID!): Package
  packages(
    filter: PackageFilter
    pagination: PaginationInput
    sort: SortInput
  ): PackageConnection!
  myPackages(
    filter: PackageFilter
    pagination: PaginationInput
    sort: SortInput
  ): PackageConnection!
}

# Package Mutations (to be extended in main Mutation type)
extend type Mutation {
  createPackage(input: CreatePackageInput!): Package!
  updatePackage(id: ID!, input: UpdatePackageInput!): Package!
  deletePackage(id: ID!): Boolean!
}