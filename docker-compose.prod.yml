version: '3.8'

services:
  # =================================================================
  # ROCKWELL API - PRODUCTION
  # =================================================================
  rockwell-api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.optimized
      target: runtime
      args:
        - NODE_ENV=production
    image: rockwell/api:latest
    container_name: rockwell-api-prod
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - CLUSTER_MODE=true
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME}
      - AWS_CLOUDFRONT_DOMAIN=${AWS_CLOUDFRONT_DOMAIN}
      - INNGEST_EVENT_KEY=${INNGEST_EVENT_KEY}
      - INNGEST_SIGNING_KEY=${INNGEST_SIGNING_KEY}
      - INNGEST_BASE_URL=${INNGEST_BASE_URL:-https://inn.gs}
      - MUX_TOKEN_ID=${MUX_TOKEN_ID}
      - MUX_TOKEN_SECRET=${MUX_TOKEN_SECRET}
      - OTEL_SERVICE_NAME=rockwell-api
      - OTEL_EXPORTER_JAEGER_ENDPOINT=${JAEGER_ENDPOINT}
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY}
      - CONTENT_MODERATION_ENABLED=true
      - RATE_LIMIT_ENABLED=true
    volumes:
      # Mount uploads directory for persistent storage
      - rockwell_uploads:/app/uploads
      # Mount conversion temp directory
      - /tmp/rockwell-conversions:/tmp/conversions
    networks:
      - rockwell-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # =================================================================
  # POSTGRESQL DATABASE - PRODUCTION
  # =================================================================
  postgres:
    image: postgres:16-alpine
    container_name: rockwell-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-rockwell}
      POSTGRES_USER: ${DB_USERNAME:-rockwell_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_MULTIPLE_EXTENSIONS: postgis,uuid-ossp
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
      # Backup directory
      - ./backups/postgres:/backups
    ports:
      - "5432:5432"
    networks:
      - rockwell-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-rockwell_user} -d ${DB_NAME:-rockwell}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 2G
          cpus: '1.0'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =================================================================
  # REDIS CACHE - PRODUCTION
  # =================================================================
  redis:
    image: redis:7-alpine
    container_name: rockwell-redis-prod
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - rockwell-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # =================================================================
  # NGINX REVERSE PROXY - PRODUCTION
  # =================================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: rockwell-nginx-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
      # Static files (if any)
      - ./static:/var/www/static:ro
    networks:
      - rockwell-network
    depends_on:
      - rockwell-api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # =================================================================
  # MONITORING & OBSERVABILITY
  # =================================================================
  
  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:v2.47.2
    container_name: rockwell-prometheus-prod
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    networks:
      - rockwell-network
    profiles: ["monitoring"]
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'

  # Grafana for metrics visualization
  grafana:
    image: grafana/grafana:10.2.0
    container_name: rockwell-grafana-prod
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://${DOMAIN}/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - rockwell-network
    depends_on:
      - prometheus
    profiles: ["monitoring"]
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'

  # =================================================================
  # BACKUP SERVICES
  # =================================================================
  
  # Database backup service
  postgres-backup:
    image: prodrigestivill/postgres-backup-local:16
    container_name: rockwell-postgres-backup
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${DB_NAME:-rockwell}
      - POSTGRES_USER=${DB_USERNAME:-rockwell_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_EXTRA_OPTS=-Z6 --schema=rockwell --blobs
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=30
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
      - HEALTHCHECK_PORT=8080
    volumes:
      - ./backups/postgres:/backups
    networks:
      - rockwell-network
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["backup"]

  # =================================================================
  # LOGGING
  # =================================================================
  
  # Centralized logging (optional)
  fluentd:
    image: fluent/fluentd:v1.16-debian-1
    container_name: rockwell-fluentd
    restart: unless-stopped
    volumes:
      - ./config/fluentd:/fluentd/etc:ro
      - fluentd_logs:/var/log/fluentd
    ports:
      - "24224:24224"
      - "24224:24224/udp"
    networks:
      - rockwell-network
    profiles: ["logging"]
    environment:
      - FLUENTD_CONF=fluent.conf
      - FLUENTD_OPT=-v

# =================================================================
# VOLUMES
# =================================================================
volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-./data}/postgres
  
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-./data}/redis
  
  rockwell_uploads:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${UPLOADS_DIR:-./data/uploads}
  
  prometheus_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-./data}/prometheus
  
  grafana_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-./data}/grafana
  
  nginx_logs:
    driver: local
  
  fluentd_logs:
    driver: local

# =================================================================
# NETWORKS
# =================================================================
networks:
  rockwell-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16